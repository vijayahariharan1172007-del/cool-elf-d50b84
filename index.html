<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#02030a">
  <title>Infinity Stones — EPISTEME</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="asset-loader" id="assetLoader" aria-live="polite" aria-label="Loading experience">
  <div class="loading-orbit">
    <span class="loading-stone ls-power"></span><span class="loading-stone ls-mind"></span><span class="loading-stone ls-space"></span>
    <span class="loading-stone ls-time"></span><span class="loading-stone ls-reality"></span><span class="loading-stone ls-soul"></span>
    <div class="loading-core"><i></i></div>
  </div>
  <div class="loading-title">EPISTEME</div>
  <div class="loading-subtitle">AWAKENING THE SIX POWERS</div>
  <div class="loading-progress"><i id="assetProgress"></i></div>
</div>

<main id="game" aria-label="Collect all six Infinity Stones">
    <div class="nebula nebula-a"></div>
    <div class="nebula nebula-b"></div>
    <div class="stars" id="stars"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="tint" id="tint"></div>

    <header class="hud">
      <div class="eyebrow">EPISTEME • COSMIC ACCESS</div>
      <div class="progress" id="progress">0 / 6</div>
    </header>

    <section class="instruction" id="instruction">
      <h1>COLLECT ALL SIX<br><span>INFINITY STONES</span></h1>
      <p>Find them. Touch them. Bring them to the centre.</p>
    </section>

    <div class="core" id="core" aria-label="Stone collection core">
      <div class="orbit-track orbit-track-main"></div>
      <div class="orbit-track orbit-track-inner"></div>
      <div class="core-ring ring-outer"></div>
      <div class="core-ring ring-inner"></div>
      <div class="core-label">ENERGY CORE</div>
    </div>

    <section class="stone-field" id="stoneField" aria-label="Six Infinity Stones">
      <button class="stone stone-power" data-stone="power" aria-label="Power Stone">
        <img src="assets/power.png" draggable="false" alt="Power Stone">
      </button>
      <button class="stone stone-mind" data-stone="mind" aria-label="Mind Stone">
        <img src="assets/mind.png" draggable="false" alt="Mind Stone">
      </button>
      <button class="stone stone-space" data-stone="space" aria-label="Space Stone">
        <img src="assets/space.png" draggable="false" alt="Space Stone">
      </button>
      <button class="stone stone-time" data-stone="time" aria-label="Time Stone">
        <img src="assets/time.png" draggable="false" alt="Time Stone">
      </button>
      <button class="stone stone-reality" data-stone="reality" aria-label="Reality Stone">
        <img src="assets/reality.png" draggable="false" alt="Reality Stone">
      </button>
      <button class="stone stone-soul" data-stone="soul" aria-label="Soul Stone">
        <img src="assets/soul.png" draggable="false" alt="Soul Stone">
      </button>
    </section>

    <button class="skip" id="skip">SKIP</button>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="flash" id="flash"></div>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
